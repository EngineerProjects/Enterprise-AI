[project]
name = "enterprise-ai"
version = "0.1.0"
description = "Python SDK for autonomous multi-agent workflows — agents that work like a real team"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "O. A. Stéphane KPOVIESSI", email = "projectsengineer6@gmail.com"},
]
keywords = ["agents", "multi-agent", "llm", "sdk", "autonomous", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core — every direct dep is exact-pinned to ==X.Y.Z.
# Rationale: ranges let PyPI ship a fresh (potentially compromised) version
# of a transitive at any time. Exact pins mean a new version only reaches
# users via an intentional bump in this file.
# When updating: bump the version AND regenerate the lock file.
# Scope rule: only packages needed by EVERY agent session belong here.
# Provider-specific, search-backend, and sandbox deps live in extras and
# are lazy-installed at first use.
dependencies = [
    "openai==1.82.0",
    "anthropic==0.49.0",
    "pydantic==2.11.5",
    "httpx==0.28.1",
    "python-dotenv==1.1.0",
    "jinja2==3.1.6",
    "tenacity==9.1.2",
    "rich==14.0.0",
    "psutil==7.0.0",
]

[project.optional-dependencies]
# Sandbox backends
docker = ["docker==7.1.0"]

# Web search backends (lazy-installed at first use)
ddgs = ["duckduckgo-search==8.0.0"]
exa = ["exa-py==1.7.0"]
firecrawl = ["firecrawl-py==1.15.0"]
tavily = ["tavily-python==0.5.0"]

# Additional LLM providers
bedrock = ["boto3==1.38.0"]
azure = ["azure-identity==1.21.0"]

# Optional server surface
server = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2"]

dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "mypy==1.15.0",
    "ruff==0.11.0",
    "pre-commit==4.2.0",
]

all = [
    "enterprise-ai[docker]",
    "enterprise-ai[ddgs]",
    "enterprise-ai[server]",
    "enterprise-ai[dev]",
]

[project.scripts]
enterprise-ai = "enterprise_ai.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enterprise_ai"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Provider files are SDK integration code — external SDK types are complex unions
# that are narrowed at runtime via .type checks. Strict union-attr checking adds
# noise without catching real bugs in this layer.
module = ["enterprise_ai.providers.*"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
