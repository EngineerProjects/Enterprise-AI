[project]
name = "enterprise-ai"
version = "0.1.0"
description = "Multi-agent artificial intelligence platform for autonomous AI teams"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "O. A. Stéphane KPOVIESSI", email = "projectsengineer6@gmail.com"},
]
keywords = ["artificial-intelligence", "agents", "multi-agent", "llm", "enterprise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "baidusearch>=1.0.3",
    "browser-use>=0.1.40",
    "docker>=7.1.0",
    "duckduckgo-search>=8.0.0",
    "googlesearch-python>=1.3.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "markdownify>=0.14.1",
    "pillow>=11.1.0",
    "playwright>=1.51.0",
    "pydantic>=2.10.6",
    "requests>=2.32.3",
    "setuptools>=78.1.0",
    "tenacity>=9.1.2",
    "toml>=0.10.2",
    "types-pyyaml>=6.0.12.20250326",
    "types-requests>=2.32.0.20250328",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

# Add scripts for post-installation setup
[project.scripts]
enterprise-ai-setup = "enterprise_ai.scripts.setup:main"

[tool.hatch.build.targets.wheel]

packages = ["enterprise_ai"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = "(examples/|notebooks/).*"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "examples",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F401"]
per-file-ignores = { "tests/*" = ["E501"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
