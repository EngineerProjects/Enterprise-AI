# Enterprise AI Configuration - Optimized

llm:
  # Default LLM provider for tools
  default_provider: "ollama"
  
  # Default model for content extraction and analysis
  default_model: "llama3.2"
  
  # Timeout for LLM completion (important for CPU-based Ollama)
  timeout: 1200.0
  
  # Alternative configurations for different providers
  providers:
    ollama:
      default_model: "llama3.2"
      base_url: "http://localhost:11434"
      timeout: 1200.0  
    
    openai:
      default_model: "gpt-4o-mini"
      api_key: "${OPENAI_API_KEY}"
      timeout: 60.0 

# Browser configuration for web tools
browser_config:
  headless: false
  disable_security: true
  extra_chromium_args: []

# Tool execution configuration - OPTIMIZED
execution:
  mode: "manual"           # Changed to manual for your testing
  max_iterations: 5
  timeout: 500.0          # Your original timeout setting
  verbose: false          # Keep clean for testing
  hybrid_threshold: 2
  
  # Additional execution options
  retry_on_failure: true
  max_retries: 2
  parallel_execution: false

# Sandbox configuration
sandbox:
  mode: "none"
  routing_enabled: false
  image: "python:3.12-slim"
  memory_limit: "512m"
  cpu_limit: 0.5
  network_enabled: false
  
  # Additional sandbox options
  auto_cleanup: true
  preserve_on_error: false

# Security configuration
security:
  allowed_tools: null     # null means all tools allowed
  forbidden_tools: []     # empty list means no forbidden tools
  require_approval: true  # Require approval for dangerous tools
  
  # Additional security options
  log_tool_executions: true
  audit_mode: false

# Logging configuration
logging:
  level: "INFO"
  file_logging: true
  console_logging: true
  log_directory: "logs"
  max_file_size: "10MB"
  backup_count: 5
  
  # Component-specific logging
  components:
    llm: "INFO"
    tools: "INFO"
    sandbox: "WARNING"
    browser: "WARNING"

# Research tool specific settings
research:
  default_depth: 2
  max_insights: 20
  results_per_search: 5
  content_analysis_timeout: 120.0
  
  # Search engine preferences
  search_engines:
    - "google"
    - "bing"
    - "duckduckgo"

# Performance optimization settings
performance:
  enable_caching: true
  cache_ttl: 300
  max_concurrent_tools: 3
  memory_limit: "2GB"
  
  # Tool-specific optimizations
  tool_initialization_timeout: 30.0
  tool_cleanup_timeout: 10.0